<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header" [class.site-header--scrolled]="scrolled()">
  <div class="site-header__inner">
    <a class="wordmark" [routerLink]="auth.isSignedIn() ? signedInHome : '/sign-in'">EstateAI</a>

    @if (auth.isSignedIn()) {
      <nav class="site-nav" aria-label="Main">
        <a
          class="site-nav__link"
          routerLink="/analyses"
          routerLinkActive="site-nav__link--active"
          ariaCurrentWhenActive="page"
          >My analyses</a
        >
      </nav>

      <div class="session">
        <a
          class="session__account"
          routerLink="/account"
          routerLinkActive="session__account--active"
          ariaCurrentWhenActive="page"
          >{{ auth.userEmail() }}</a
        >
        <button class="session__sign-out" type="button" (click)="signOut()">Sign out</button>
      </div>
    }
  </div>
  @if (signOutError(); as message) {
    <p class="site-header__error" role="alert">{{ message }}</p>
  }
</header>

<main id="main-content" class="site-main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span class="wordmark wordmark--small">EstateAI</span>
    <span>Property valuation and investment decision support</span>
  </div>
</footer>
